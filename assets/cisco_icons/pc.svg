<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
      <!-- Cisco Packet Tracer Desktop PC Host -->
      <!-- Monitor Screen -->
      <rect x="15" y="12" width="60" height="44" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <rect x="20" y="17" width="50" height="34" fill="#1e293b"/>
      <!-- Terminal prompt on screen -->
      <text x="24" y="32" fill="#22c55e" font-size="9" font-family="monospace" font-weight="bold">&gt;_</text>
      <line x1="38" y1="30" x2="50" y2="30" stroke="#22c55e" stroke-width="2"/>
      <!-- Stand -->
      <polygon points="40,56 50,56 54,66 36,66" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
      <rect x="30" y="66" width="30" height="4" rx="1" fill="#334155"/>
      <!-- Keyboard -->
      <rect x="18" y="72" width="54" height="8" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    </svg>