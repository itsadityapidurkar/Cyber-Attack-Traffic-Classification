<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
      <!-- Cisco ASA Firewall: Brick wall pattern with security shield -->
      <rect x="8" y="15" width="74" height="60" rx="4" fill="#b91c1c" stroke="#ef4444" stroke-width="2.5"/>
      <!-- Brick mortar lines -->
      <line x1="8" y1="35" x2="82" y2="35" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="8" y1="55" x2="82" y2="55" stroke="#7f1d1d" stroke-width="2"/>
      <!-- Vertical Mortar -->
      <line x1="26" y1="15" x2="26" y2="35" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="64" y1="15" x2="64" y2="35" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="45" y1="35" x2="45" y2="55" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="26" y1="55" x2="26" y2="75" stroke="#7f1d1d" stroke-width="2"/>
      <line x1="64" y1="55" x2="64" y2="75" stroke="#7f1d1d" stroke-width="2"/>
      <!-- Center Security Crest -->
      <polygon points="45,26 62,34 56,58 45,66 34,58 28,34" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <!-- Flame icon inside crest -->
      <path d="M45,36 Q49,44 51,48 Q54,54 49,60 Q45,62 42,60 Q38,57 41,51 Q43,47 45,36 Z" fill="#ea580c"/>
    </svg>